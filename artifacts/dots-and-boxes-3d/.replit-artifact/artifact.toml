kind = "web"
previewPath = "/"
title = "3D Dots & Boxes"
version = "1.0.0"
id = "artifacts/dots-and-boxes-3d"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25432

[services.development]
run = "pnpm --filter @workspace/dots-and-boxes-3d run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dots-and-boxes-3d", "run", "build" ]
publicDir = "artifacts/dots-and-boxes-3d/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25432"
BASE_PATH = "/"
