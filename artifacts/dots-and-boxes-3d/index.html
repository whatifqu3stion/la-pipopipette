<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>3D Dots & Boxes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <script>
      // The hosted Vibe Jam widget currently serves malformed JavaScript in
      // some environments ("Unexpected identifier 'a'"). Keep the badge and
      // heartbeat locally so a third-party syntax error cannot crash the app.
      (function () {
        function initVibeJam() {
          if (document.querySelector('a[data-vibejam-badge]')) return;

          var anchor = document.createElement('a');
          anchor.dataset.vibejamBadge = 'true';
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          anchor.href = 'https://vibejam.com/';
          anchor.textContent = '🕹️ Vibe Jam 2026';
          anchor.style.cssText =
            "font-family: system-ui, sans-serif; position: fixed; bottom: -1px; right: -1px; padding: 7px 14px; font-size: 14px; font-weight: bold; background: #000; color: #fff; text-decoration: none; z-index: 10000; border-top-left-radius: 12px; border: 1px solid #000;";
          document.body.appendChild(anchor);

          var active = false;
          var timer = null;
          function onInput() { active = true; }
          function tick() {
            if (!active) return;
            fetch('https://vibejam.com/2026/heartbeat.php', {
              method: 'GET',
              mode: 'cors',
              keepalive: true
            }).catch(function () {});
            active = false;
          }
          ['keydown', 'mousedown', 'mousemove', 'touchstart', 'touchmove',
            'wheel', 'gamepadconnected'].forEach(function (eventName) {
            document.addEventListener(eventName, onInput);
          });
          function start() {
            if (!timer) timer = setInterval(tick, 60000);
          }
          function stop() {
            if (timer) {
              clearInterval(timer);
              timer = null;
            }
          }
          if (document.visibilityState !== 'hidden') start();
          document.addEventListener('visibilitychange', function () {
            document.visibilityState === 'hidden' ? stop() : start();
          });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initVibeJam);
        } else {
          initVibeJam();
        }
      })();
    </script>
    <script>
      // Re-anchor the Vibe Jam tracker to the middle of the right edge,
      // rotated 90° counter-clockwise. The widget script appends a single
      // <a href="https://vibejam.com/"> to body and sets its style via
      // .cssText (no !important), so external/inline overrides with
      // !important win. Tracking (event listeners on document + heartbeat
      // fetch to vibej.am) is independent of these visual styles, so we
      // only touch positioning/transform — never the link target, the
      // listeners, or the script itself.
      //
      // Detection strategy: a MutationObserver on <body> waits indefin-
      // itely for the anchor to appear. This survives slow networks /
      // throttled tabs / async-script-loaded-after-DCL, where a fixed
      // polling timeout would otherwise miss the anchor and leave the
      // badge stuck in its default bottom-right position (where it can
      // be covered by other UI).
      (function () {
        var anchor = null;
        function applyStyles() {
          if (!anchor) return;
          // Measure the badge's natural (unrotated) size so we can flush
          // its post-rotation right edge against the viewport edge — works
          // for any text or font without hard-coded magic numbers. We
          // briefly clear our own overrides so the measurement reflects
          // the unrotated layout, then re-apply.
          var s = anchor.style;
          s.removeProperty('transform');
          s.removeProperty('right');
          var r = anchor.getBoundingClientRect();
          var rightOffset = -((r.width - r.height) / 2);
          s.setProperty('position',         'fixed',                                'important');
          s.setProperty('top',              '50%',                                  'important');
          s.setProperty('right',            rightOffset + 'px',                     'important');
          s.setProperty('bottom',           'auto',                                 'important');
          s.setProperty('left',             'auto',                                 'important');
          s.setProperty('transform-origin', 'center center',                        'important');
          s.setProperty('transform',        'translateY(-50%) rotate(90deg)',       'important');
          // Force-stack above any in-app overlay (grain/crumple sit at
          // zIndex 2-3, UI at 10+; max-int here guarantees the badge
          // can never be covered by future layers).
          s.setProperty('z-index',          '2147483647',                           'important');
          // After +90° rotation (CW) the original BOTTOM edge becomes
          // the visible left side of the vertical tab (the side that
          // pokes into the canvas, away from the screen edge). Round
          // those two corners; leave the now-visible right side flush.
          s.setProperty('border-radius',    '0 0 12px 12px',                        'important');
          // Defence-in-depth against accidental hides — if any extension
          // or future style tries to suppress the tab via display /
          // visibility / opacity, our !important values win.
          s.setProperty('display',          'inline-block',                         'important');
          s.setProperty('visibility',       'visible',                              'important');
          s.setProperty('opacity',          '1',                                    'important');
          s.setProperty('pointer-events',   'auto',                                 'important');
        }
        function bindResize() {
          // Re-measure on viewport changes so the right-edge flush stays
          // correct under resize / orientation change / device rotation.
          var raf = 0;
          window.addEventListener('resize', function () {
            if (raf) return;
            raf = requestAnimationFrame(function () { raf = 0; applyStyles(); });
          });
        }
        function ensureLastChild() {
          // Re-appending an existing node moves it. Putting the badge
          // last in <body> means that when two siblings tie on z-index
          // (or both rely on auto stacking), document order resolves the
          // tie in our favour — so the badge wins paint order against
          // anything later code or extensions might inject.
          if (anchor && anchor.parentNode === document.body &&
              document.body.lastElementChild !== anchor) {
            document.body.appendChild(anchor);
          }
        }
        function tryClaim() {
          var a = document.querySelector('a[data-vibejam-badge]');
          if (!a) return false;
          anchor = a;
          ensureLastChild();
          applyStyles();
          bindResize();
          return true;
        }
        function init() {
          if (tryClaim()) {
            // Keep the anchor pinned to last-child position even if other
            // scripts append nodes to <body> later (e.g. injected over-
            // lays from browser extensions). Cheap: only acts when a new
            // last child appears.
            new MutationObserver(ensureLastChild)
              .observe(document.body, { childList: true });
            return;
          }
          // Anchor not in DOM yet — watch for it. We observe <body>
          // (where the widget appends) for added subtrees and re-check
          // on each batch. Once found, switch to the lighter "keep last
          // child" observer above by recursing into init().
          var obs = new MutationObserver(function () {
            if (tryClaim()) {
              obs.disconnect();
              new MutationObserver(ensureLastChild)
                .observe(document.body, { childList: true });
            }
          });
          obs.observe(document.body, { childList: true, subtree: true });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
